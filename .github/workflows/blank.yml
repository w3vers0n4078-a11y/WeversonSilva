          Write-Host "║        ENIGMANO RDP ACCESS             ║"
          Write-Host "╠════════════════════════════════════════╣"
          Write-Host "║ Host:     $env:TAILSCALE_IP             ║"
          Write-Host "║ Username: runneradmin                   ║"
          Write-Host "║ Password: P@ssw0rd!                     ║"
          Write-Host "╚════════════════════════════════════════╝"

          Write-Host "`nConnection Instructions:" -ForegroundColor Green
          Write-Host "1. Install Tailscale on your device (phone, PC, etc.)"
          Write-Host "2. Log in with the same Tailscale account"
          Write-Host "3. Open Remote Desktop app and enter the IP above"
          Write-Host "4. Use the provided credentials to connect"

      - name: Keep Session Alive
